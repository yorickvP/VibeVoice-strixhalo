[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevoice"
version = "1.0.0"
authors = [
  { name="vibevoice team", email="VibeVoice@microsoft.com" },
]
description = "Open-Source Frontier Voice AI."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    # "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # ROCm 7.13 torch build for gfx1151 (Strix Halo), see [tool.uv.sources].
    # triton and rocm* are torch's own deps; listed here so uv takes them from the AMD index too.
    "torch==2.11.0",
    "triton==3.6.0",
    "rocm[libraries]==7.13.0",
    "rocm-sdk-core==7.13.0",
    "rocm-sdk-libraries-gfx1151==7.13.0",
    "transformers>=4.51.3,<5.0.0",
    "diffusers",
    "numpy",
    "tqdm",
    "soundfile",
    "librosa",
]


[project.urls]
"Homepage" = "https://github.com/microsoft/VibeVoice"
"Bug Tracker" = "https://github.com/microsoft/VibeVoice/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibevoice*"]

# ROCm build of torch for gfx1151 (Strix Halo / Radeon 8060S), from AMD's wheel index.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "rocm-gfx1151"
url = "https://repo.amd.com/rocm/whl/gfx1151/"
explicit = true

[tool.uv.sources]
torch = { index = "rocm-gfx1151" }
triton = { index = "rocm-gfx1151" }
rocm = { index = "rocm-gfx1151" }
rocm-sdk-core = { index = "rocm-gfx1151" }
rocm-sdk-libraries-gfx1151 = { index = "rocm-gfx1151" }
